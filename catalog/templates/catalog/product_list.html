{% extends 'base.html' %}

{% block content %}
    <h1>Продукты</h1>
    <a href="{% url 'catalog:product_create' %}">Создать новый продукт</a>
    <ul>
        {% for product in products %}
            <li>
                {{ product.name }} - {{ product.price }} руб.
                {% if product.owner == request.user %}
                    <a href="{% url 'catalog:product_update' product.pk %}">Редактировать</a>
                    <form action="{% url 'catalog:product_delete' product.pk %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <input type="submit" value="Удалить">
                    </form>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
