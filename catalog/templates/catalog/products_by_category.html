{% extends 'base.html' %}

{% block content %}
    <h1>Продукты в категории</h1>
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'catalog:product_detail' product.pk %}">{{ product.name }}</a>
                - {{ product.price }} руб.
            </li>
        {% endfor %}
    </ul>
{% endblock %}
